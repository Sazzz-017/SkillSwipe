spring.application.name=SkillSwipe

spring.datasource.url=jdbc:mysql://localhost:3306/SkillSwip_db
spring.datasource.username=root
spring.datasource.password=    #Removed Intentionally for Submission

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ─── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
# Prevents Spring from failing to start when Kafka is not running.
# Topic creation and consumer connection are retried lazily instead.
spring.kafka.admin.fail-fast=false
spring.kafka.listener.missing-topics-fatal=false

# Custom app-level properties (referenced in KafkaConfig & listeners)
app.kafka.topic.like-notification=user-like-notification

# ─── Brevo (Sendinblue) SMTP ──────────────────────────────────────────────────
# Replace the values below with your actual Brevo SMTP credentials.
# Brevo SMTP settings: https://help.brevo.com/hc/en-us/articles/209462765
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=465
spring.mail.username=            #Removed Intentionally for Submission
spring.mail.password=           #Removed Intentionally for Submission
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# Sender address shown in the email — must be a verified sender in your Brevo account
app.mail.from=               #Removed Intentionally for Submission

# ─── Spring AI (Hyperspace / OpenAI-compatible) ───────────────────────────────
spring.ai.openai.base-url=               #Removed Intentionally for Submission
spring.ai.openai.api-key=                #Removed Intentionally for Submission
spring.ai.openai.chat.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.7
# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=                  #Removed Intentionally for Submission


